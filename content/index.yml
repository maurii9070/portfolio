about:
  title: "Sobre mí"
  description: |
    Soy Analista Programador Universitario (UNJu, 2022–2025) y me especializo en el diseño de APIs REST con .NET (ASP.NET) y en la construcción de interfaces modernas con Nuxt y Vue.js.
    Trabajo con arquitecturas escalables como Vertical Slice y Clean Architecture, y me gusta llevar los proyectos a producción: Docker, CI/CD con GitHub Actions, y monitoreo con Prometheus y Grafana.
