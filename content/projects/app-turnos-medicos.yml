title: "App Turnos Médicos"
description: "Aplicación full stack para gestión y reserva de turnos en consultorios médicos. Resuelve el problema real de organización y solapamiento de citas. Stack: ASP.NET Core con EF Core y PostgreSQL bajo Vertical Slice Architecture, frontend en Nuxt + Nuxt UI, autenticación con Access/Refresh Tokens, integración con Mercado Pago (Webhooks) y almacenamiento de archivos en Supabase."
