title: "Infraestructura & DevOps"
description: "Co-desarrollo de una aplicación en Next.js con un clúster de PostgreSQL en configuración Maestro/Réplica y HAProxy como balanceador de carga. Pipeline CI/CD automatizado con GitHub Actions hacia Docker Hub, Watchtower para actualizaciones en caliente, y monitoreo en tiempo real con Prometheus y Grafana. Incluye servicios de backups automatizados."
