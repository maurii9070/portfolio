title: "Gestión de Cadetería"
description: "Proyecto de análisis y desarrollo: lideré el diseño arquitectónico y el modelado lógico de un sistema de gestión para una empresa de cadetería, aplicando el Proceso Unificado (PU). El objetivo fue optimizar la asignación y logística de pedidos, modelando los flujos de entrega, estados de pedidos y asignación de cadetes."
